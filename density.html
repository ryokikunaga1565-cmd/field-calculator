<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#153d49"><meta name="apple-mobile-web-app-title" content="県水現場計算"><title>県水現場計算</title><style>*{box-sizing:border-box}body{margin:0;background:#f1f4f2;color:#193740;font-family:system-ui,sans-serif}header{background:#153d49;color:white;padding:26px max(20px,calc((100% - 960px)/2))}header small{color:#aed9cd;letter-spacing:.18em}h1{font-size:26px;margin:9px 0}header p{margin:0;font-size:13px;color:#c9d9dc}main{max-width:960px;margin:24px auto;padding:0 16px}nav{display:flex;gap:6px;margin:20px 0}button{font:inherit;cursor:pointer}nav button{flex:1;border:1px solid #d6dfdb;background:white;border-radius:10px;padding:13px 5px;font-size:13px;color:#37535a}nav button[aria-selected=true]{background:#153d49;color:white;border-color:#153d49}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.card{background:white;border:1px solid #dde5e1;border-radius:16px;padding:22px;margin-bottom:20px}h2{font-size:17px;margin:0 0 18px}.muted,small{font-size:12px;color:#62777b;line-height:1.7}.fields{display:grid;grid-template-columns:1fr 1fr;gap:16px}label{font-size:13px;display:block}input{display:block;width:100%;margin:7px 0 0;border:1px solid #cddbd6;background:#fbfcfb;border-radius:8px;padding:13px;font-size:21px;color:#153d49;min-width:0}input:focus{outline:2px solid #3a9484} .result{background:#e8f4ef;padding:16px;border-radius:10px;margin-top:18px}.result b{font-size:28px}.result span{font-size:13px}table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:right;padding:14px 6px;border-bottom:1px solid #e7ece9}th{font-size:11px;color:#62777b}th:first-child,td:first-child{text-align:left}td:nth-child(2){font-weight:700;color:#13725f}details summary{cursor:pointer;font-size:14px;font-weight:600}svg{width:100%;height:auto}dt{font-weight:600}dd{margin:0 0 8px}.error{color:#ab432d}footer{text-align:center
