.tool-switch{display:flex;gap:8px;margin-bottom:20px}.tool-switch a{flex:1;text-align:center;text-decoration:none;border:1px solid #bdcdc7;border-radius:10px;padding:14px 6px;color:#193740;font-size:14px;background:white}.tool-switch a[aria-current=page]{background:#153d49;color:white}</style><header><small>PIPE OFFSET CALCULATOR</small><h1>曲管ひねり計算</h1><p>寸法を入力して、曲管ごとの必要な長さを確認。単位はすべて mm。</p></header><main><div class="tool-switch" aria-label="計算ツール"><a href="./" aria-current="page">曲管ひねり計算</a><a href="density.html">砂置換法</a></div><nav aria-label="計算方法"><button data-mode="position" aria-selected="true">土被り・占用位置</button><button data-mode="direct" aria-selected="false">ℓ を直接入力</button><button data-mode="offset" aria-selected="false">土被り・離れ</button></nav><div class="grid"><section class="card"><h2>01　寸法を入力</h2><div id="fields"></div><p class="muted" id="hint"></p><div id="offsetResult" class="result" aria-live="polite"></div></section><section class="card"><h2>02　角度ごとの計算結果</h2><p class="muted">長さは四捨五入して1 mm単位で表示</p><div id="results" aria-live="polite"></div><p class="muted">y：管中心線の長さ（AB）<br>x：進行方向の距離（AC）<br>y は切管寸法ではありません。切管寸法は曲管の受口・挿口寸法を考慮して求めます。</p></section></div><section class="card"><details open><summary>計算図と記号を見る</summary><svg viewBox="0 0 800 360" role="img" aria-label="AからBへ向かう管中心線y、高低差a、平面の離れb、ずれℓ、進行方向の距離xを示す立体図"><g fill="none" stroke="#b6c9c6" stroke-width="1.5"><path d="M80 270V130H470V270M80 130L210 40H600V180M470 130L600 40"/><path stroke-dasharray="5 5" d="M80 270L210 180V40M210 180H600"/></g><g fill="none" stroke-width="3"><path stroke="#277aaf" d="M80 270L600 40"/><path stroke="#183b46" d="M80 270H470L600 180ZM470 270L600 40"/><path stroke="#328b67" d="M600 40V180"/><path stroke="#da8a2e" d="M470 270L600 180"/></g><g font-family="system-ui" font-size="21" fill="#193740"><text x="56" y="296">A</text><text x="609" y="37">B</text><text x="470" y="296">C</text><text x="609" y="192">D</text><text x="324" y="143" fill="#277aaf">y</text><text x="540" y="124">ℓ</text><text x="615" y="115" fill="#328b67">a</text><text x="547" y="246" fill="#da8a2e">b</text><text x="270" y="301">x</text></g><g font-size="15" fill="#49646b"><text x="650" y="62">a：高低差</text><text x="650" y="94">b：平面の離れ</text><text x="650" y="126">ℓ：斜辺のずれ</text><text x="650" y="158">y：管中心線長</text><text x="650" y="190">x：進行方向距離</text><text x="80" y="340">ℓ = √(a² + b²)　　y = ℓ / sin θ　　x = ℓ / tan θ</text></g></svg><p class="muted">θ は曲管角度（AB と AC のなす角）。土被りの差を高低差として扱うため、同じ地盤高・同じ管外径が前提です。</p></details></section><footer>曲管ひねり計算 · mm</footer></main><script src="app.js"></script></html>
